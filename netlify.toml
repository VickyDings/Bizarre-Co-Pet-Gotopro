# Static site, no build step - Netlify serves the repo as-is.
#
# Netlify resolves /blog/axolotl-care-guide to blog/axolotl-care-guide.html
# automatically, which is what the canonical tags and sitemap.xml expect.
# Deploy previews (a live URL per pull request) and noindex headers on those
# previews are both Netlify defaults - nothing to configure here.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
