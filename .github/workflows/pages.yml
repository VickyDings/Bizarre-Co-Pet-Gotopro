# Publishes the site to GitHub Pages on every push to the default branch.
# No build step - the repo is served as-is.
name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is currently the claude/website-redesign
    # branch rather than main, so it is listed explicitly. If you rename the
    # default branch to main, this keeps working - just drop the long name.
    branches:
      - main
      - master
      - claude/website-redesign-collectibles-pets-OpNSz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
